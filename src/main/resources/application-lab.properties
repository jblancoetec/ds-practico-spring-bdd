# Perfil "lab" — valores provistos por el docente en clase.
# El estudiante debe editar este archivo con los datos de conexión
# que el laboratorio entrega antes de levantar la app.
# Los defaults abajo sirven para una primera ejecución local contra
# un MariaDB del docente en la misma máquina; reemplazá por los datos
# provistos por el laboratorio (host, puerto, db, usuario, contraseña).
spring.datasource.url=jdbc:mariadb://localhost:3306/practico_bdd
spring.datasource.username=estudiante
spring.datasource.password=estudiante_practico
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
