# version: "3.8"

services:
  db:
    image: mariadb:latest
    container_name: mariadb-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_practico
      MYSQL_DATABASE: practico_bdd
      MYSQL_USER: estudiante
      MYSQL_PASSWORD: estudiante_practico
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql:ro

volumes:
  mariadb_data:
